<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sha3ban-os - Modern Operating System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
  
  /* ===== BOOT SCREEN ===== */
  #boot-screen {
    position: fixed; inset: 0; background: #000; z-index: 10000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s;
  }
  #boot-screen .logo {
    width: 80px; height: 80px; margin-bottom: 40px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  #boot-screen .logo div { background: #0078d4; border-radius: 2px; }
  #boot-screen .spinner {
    width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-text {
    position: absolute; top: 20px; left: 20px; font-family: 'Consolas', monospace;
    font-size: 12px; color: #aaa; line-height: 1.4; white-space: pre;
  }
  
  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed; inset: 0; z-index: 9000;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s;
  }
  #login-screen .avatar {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  #login-screen .avatar img {
    width: 100%; height: 100%; object-fit: cover;
  }
  #login-screen .username { font-size: 28px; margin-bottom: 30px; font-weight: 300; }
  #login-screen input {
    width: 280px; padding: 10px 16px; border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1); color: #fff; border-radius: 4px;
    font-size: 14px; outline: none; backdrop-filter: blur(10px);
  }
  #login-screen input:focus { border-color: #60a5fa; }
  #login-screen .hint { margin-top: 12px; font-size: 12px; opacity: 0.7; }
  #login-screen .time { position: absolute; top: 60px; font-size: 72px; font-weight: 200; }
  #login-screen .date { position: absolute; top: 140px; font-size: 20px; font-weight: 300; }
  
  /* ===== DESKTOP ===== */
  #desktop {
    position: fixed; inset: 0;
    background: url('images/profile.jpg') center/cover no-repeat;
    display: none; overflow: hidden;
  }
  #desktop-icons {
    position: absolute; top: 20px; left: 20px;
    display: grid; grid-template-columns: repeat(auto-fill, 90px);
    gap: 10px; max-height: calc(100% - 80px);
  }
  .desktop-icon {
    width: 80px; padding: 8px; text-align: center; cursor: pointer;
    border-radius: 6px; transition: background 0.15s;
  }
  .desktop-icon:hover { background: rgba(255,255,255,0.15); }
  .desktop-icon.selected { background: rgba(96,165,250,0.3); border: 1px solid rgba(96,165,250,0.5); }
  .desktop-icon .icon { font-size: 36px; margin-bottom: 4px; }
  .desktop-icon .label { font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); word-wrap: break-word; }
  
  /* ===== TASKBAR ===== */
  #taskbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 48px;
    background: rgba(32, 32, 32, 0.75); backdrop-filter: blur(30px);
    display: flex; align-items: center; justify-content: center;
    border-top: 1px solid rgba(255,255,255,0.08); z-index: 1000;
  }
  #taskbar-center { display: flex; gap: 4px; align-items: center; }
  .taskbar-btn {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; cursor: pointer; position: relative; transition: background 0.15s;
  }
  .taskbar-btn:hover { background: rgba(255,255,255,0.1); }
  .taskbar-btn.active { background: rgba(255,255,255,0.15); }
  .taskbar-btn.active::after {
    content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 3px; background: #60a5fa; border-radius: 2px;
  }
  .taskbar-btn svg { width: 20px; height: 20px; }
  
  #taskbar-left { position: absolute; left: 12px; display: flex; gap: 4px; }
  #taskbar-right {
    position: absolute; right: 12px; display: flex; gap: 4px; align-items: center;
  }
  .tray-btn {
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    transition: background 0.15s;
  }
  .tray-btn:hover { background: rgba(255,255,255,0.1); }
  .tray-btn svg { width: 16px; height: 16px; }
  #clock { padding: 6px 12px; text-align: right; cursor: pointer; border-radius: 6px; }
  #clock:hover { background: rgba(255,255,255,0.1); }
  #clock .time { font-size: 12px; }
  #clock .date { font-size: 11px; opacity: 0.8; }
  
  /* ===== START MENU ===== */
  #start-menu {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(20px);
    width: 600px; max-width: 95vw; height: 600px; max-height: 80vh;
    background: rgba(40, 40, 40, 0.85); backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 24px; display: none; flex-direction: column;
    opacity: 0; transition: all 0.25s; z-index: 2000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #start-menu.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  #start-search {
    width: 100%; padding: 10px 16px; border-radius: 20px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 14px; outline: none; margin-bottom: 20px;
  }
  #start-search:focus { border-color: #60a5fa; }
  .start-section-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .start-pinned { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 24px; }
  .start-app {
    padding: 12px 8px; text-align: center; border-radius: 6px; cursor: pointer;
    transition: background 0.15s;
  }
  .start-app:hover { background: rgba(255,255,255,0.1); }
  .start-app .icon { font-size: 28px; margin-bottom: 4px; }
  .start-app .name { font-size: 11px; }
  .start-recent { display: flex; flex-direction: column; gap: 4px; }
  .start-recent-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    transition: background 0.15s;
  }
  .start-recent-item:hover { background: rgba(255,255,255,0.1); }
  #start-footer {
    margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  .start-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; }
  .start-user:hover { background: rgba(255,255,255,0.1); }
  .start-user .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; }
  .start-user .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  .start-power { padding: 8px; border-radius: 6px; cursor: pointer; }
  .start-power:hover { background: rgba(255,255,255,0.1); }
  
  /* ===== WINDOWS ===== */
  .window {
    position: absolute; min-width: 320px; min-height: 200px;
    background: rgba(32, 32, 32, 0.92); backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column;
    overflow: hidden; z-index: 100;
  }
  .window.maximized { border-radius: 0; }
  .window-titlebar {
    height: 36px; display: flex; align-items: center;
    background: rgba(40, 40, 40, 0.8); cursor: move; flex-shrink: 0;
  }
  .window-title { flex: 1; padding: 0 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .window-controls { display: flex; height: 100%; }
  .window-ctrl {
    width: 46px; height: 100%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
  }
  .window-ctrl:hover { background: rgba(255,255,255,0.1); }
  .window-ctrl.close:hover { background: #e81123; }
  .window-ctrl svg { width: 12px; height: 12px; }
  .window-body { flex: 1; overflow: auto; position: relative; }
  .window-resize {
    position: absolute; bottom: 0; right: 0; width: 16px; height: 16px;
    cursor: nwse-resize; z-index: 10;
  }
  
  /* ===== NOTIFICATION CENTER ===== */
  #notif-center {
    position: absolute; bottom: 56px; right: 12px; width: 360px;
    background: rgba(40, 40, 40, 0.85); backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 16px; display: none; z-index: 2000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #notif-center.show { display: block; }
  .quick-settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .qs-btn {
    padding: 12px; border-radius: 6px; background: rgba(255,255,255,0.08);
    cursor: pointer; text-align: center; font-size: 11px; transition: all 0.15s;
  }
  .qs-btn.active { background: #60a5fa; }
  .qs-btn:hover { background: rgba(255,255,255,0.15); }
  .qs-btn .icon { font-size: 18px; margin-bottom: 4px; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; }
  .slider-row input[type=range] { flex: 1; accent-color: #60a5fa; }
  .notif-list { display: flex; flex-direction: column; gap: 8px; }
  .notif-item {
    padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px;
    font-size: 12px;
  }
  .notif-item .title { font-weight: 600; margin-bottom: 2px; }
  
  /* ===== APP STYLES ===== */
  .app-file-explorer { display: flex; height: 100%; }
  .fe-sidebar { width: 200px; background: rgba(0,0,0,0.2); padding: 12px; overflow-y: auto; font-size: 13px; }
  .fe-sidebar-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .fe-sidebar-item:hover { background: rgba(255,255,255,0.08); }
  .fe-sidebar-item.active { background: rgba(96,165,250,0.2); }
  .fe-main { flex: 1; display: flex; flex-direction: column; }
  .fe-toolbar { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .fe-toolbar button { padding: 4px 10px; background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 4px; cursor: pointer; }
  .fe-toolbar button:hover { background: rgba(255,255,255,0.15); }
  .fe-path { flex: 1; padding: 4px 10px; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 12px; }
  .fe-content { flex: 1; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 10px; align-content: start; }
  .fe-item { padding: 8px; text-align: center; border-radius: 6px; cursor: pointer; }
  .fe-item:hover { background: rgba(255,255,255,0.08); }
  .fe-item.selected { background: rgba(96,165,250,0.25); }
  .fe-item .icon { font-size: 32px; }
  .fe-item .name { font-size: 11px; margin-top: 4px; word-wrap: break-word; }
  
  .app-notepad { display: flex; flex-direction: column; height: 100%; }
  .app-notepad textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 12px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; }
  .app-notepad .menubar { display: flex; gap: 2px; padding: 4px 8px; background: rgba(0,0,0,0.2); font-size: 12px; }
  .app-notepad .menubar button { padding: 4px 10px; background: transparent; border: none; color: #fff; cursor: pointer; border-radius: 4px; }
  .app-notepad .menubar button:hover { background: rgba(255,255,255,0.1); }
  
  .app-calc { padding: 12px; display: flex; flex-direction: column; height: 100%; }
  .calc-display { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 6px; text-align: right; margin-bottom: 12px; min-height: 80px; }
  .calc-display .expr { font-size: 14px; opacity: 0.6; min-height: 20px; }
  .calc-display .result { font-size: 36px; font-weight: 300; }
  .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
  .calc-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.1s; }
  .calc-btn:hover { background: rgba(255,255,255,0.15); }
  .calc-btn.op { background: rgba(96,165,250,0.2); }
  .calc-btn.eq { background: #60a5fa; }
  .calc-btn.eq:hover { background: #3b82f6; }
  
  .app-paint { display: flex; flex-direction: column; height: 100%; }
  .paint-toolbar { padding: 8px; background: rgba(0,0,0,0.2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .paint-toolbar button { padding: 4px 10px; background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 4px; cursor: pointer; }
  .paint-toolbar button:hover { background: rgba(255,255,255,0.15); }
  .paint-toolbar button.active { background: #60a5fa; }
  .paint-toolbar input[type=color] { width: 32px; height: 28px; border: none; cursor: pointer; background: transparent; }
  .paint-toolbar input[type=range] { width: 80px; accent-color: #60a5fa; }
  .paint-canvas-wrap { flex: 1; overflow: auto; background: #2a2a2a; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .paint-canvas-wrap canvas { background: #fff; cursor: crosshair; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  
  .app-browser { display: flex; flex-direction: column; height: 100%; }
  .browser-toolbar { padding: 8px; background: rgba(0,0,0,0.2); display: flex; gap: 6px; align-items: center; }
  .browser-toolbar button { padding: 6px 10px; background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 4px; cursor: pointer; }
  .browser-toolbar button:hover { background: rgba(255,255,255,0.15); }
  .browser-url { flex: 1; padding: 6px 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; font-size: 13px; outline: none; }
  .browser-url:focus { border-color: #60a5fa; }
  .browser-tabs { display: flex; background: rgba(0,0,0,0.3); padding: 4px 4px 0; gap: 2px; overflow-x: auto; }
  .browser-tab { padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 6px 6px 0 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 200px; white-space: nowrap; }
  .browser-tab.active { background: rgba(40,40,40,0.9); }
  .browser-tab .close-tab { opacity: 0.5; }
  .browser-tab .close-tab:hover { opacity: 1; }
  .browser-tab-new { padding: 6px 10px; font-size: 14px; cursor: pointer; color: #aaa; border-radius: 0 6px 0 0; }
  .browser-tab-new:hover { background: rgba(255,255,255,0.08); }
  .browser-content { flex: 1; background: #fff; position: relative; }
  .browser-content iframe { width: 100%; height: 100%; border: none; }
  .browser-statusbar { padding: 3px 10px; font-size: 11px; color: #888; background: rgba(0,0,0,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .browser-opennew { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 14px; background: #1a1a1a; }
  .browser-opennew button { padding: 10px 18px; background: #60a5fa; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .browser-opennew button:hover { background: #3b82f6; }
  .browser-opennew .sep { opacity: 0.5; font-size: 12px; }
  .browser-opennew a { color: #60a5fa; }
  
  .app-terminal { background: #0c0c0c; height: 100%; padding: 12px; font-family: 'Consolas', monospace; font-size: 13px; overflow-y: auto; color: #ccc; }
  .terminal-line { margin-bottom: 2px; white-space: pre-wrap; word-wrap: break-word; }
  .terminal-input-line { display: flex; align-items: center; }
  .terminal-prompt { color: #60a5fa; margin-right: 8px; white-space: nowrap; }
  .terminal-input { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: inherit; outline: none; }
  
  .app-settings { display: flex; height: 100%; }
  .settings-sidebar { width: 220px; background: rgba(0,0,0,0.2); padding: 12px; overflow-y: auto; }
  .settings-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; font-size: 13px; }
  .settings-item:hover { background: rgba(255,255,255,0.08); }
  .settings-item.active { background: rgba(96,165,250,0.2); }
  .settings-content { flex: 1; padding: 24px; overflow-y: auto; }
  .settings-content h2 { margin-bottom: 16px; font-weight: 500; }
  .settings-card { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .toggle { width: 40px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; position: relative; cursor: pointer; transition: background 0.2s; }
  .toggle.on { background: #60a5fa; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(20px); }
  
  .app-taskmgr { display: flex; flex-direction: column; height: 100%; font-size: 12px; }
  .taskmgr-tabs { display: flex; background: rgba(0,0,0,0.2); padding: 4px; gap: 2px; }
  .taskmgr-tab { padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  .taskmgr-tab.active { background: rgba(96,165,250,0.2); }
  .taskmgr-content { flex: 1; overflow-y: auto; padding: 8px; }
  .taskmgr-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 6px 8px; border-radius: 4px; }
  .taskmgr-row:hover { background: rgba(255,255,255,0.05); }
  .taskmgr-header { font-weight: 600; opacity: 0.7; border-bottom: 1px solid rgba(255,255,255,0.1); }
  
  .app-about { padding: 24px; text-align: center; }
  .app-about .logo-big { font-size: 64px; margin-bottom: 12px; }
  .app-about h1 { font-size: 24px; font-weight: 300; margin-bottom: 8px; }
  .app-about .version { opacity: 0.6; margin-bottom: 20px; }
  .app-about .info { text-align: left; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.8; }
  
  .app-imgviewer { display: flex; flex-direction: column; height: 100%; background: #1a1a1a; }
  .imgviewer-toolbar { padding: 8px; background: rgba(0,0,0,0.3); display: flex; gap: 6px; }
  .imgviewer-toolbar button { padding: 4px 10px; background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .imgviewer-content { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; }
  .imgviewer-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
  
  /* ===== CONTEXT MENU ===== */
  .context-menu {
    position: absolute; background: rgba(40,40,40,0.95); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px;
    min-width: 200px; z-index: 5000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    font-size: 13px;
  }
  .context-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .context-item:hover { background: rgba(96,165,250,0.2); }
  .context-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
  
  /* ===== TOAST ===== */
  #toast-container { position: absolute; bottom: 60px; right: 12px; z-index: 6000; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: rgba(40,40,40,0.95); backdrop-filter: blur(20px); padding: 12px 16px; border-radius: 8px; border-left: 3px solid #60a5fa; min-width: 250px; font-size: 13px; animation: slideIn 0.3s; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  /* ===== RTL (ARABIC) ===== */
  html[dir="rtl"] #desktop-icons { left: auto; right: 20px; }
  html[dir="rtl"] #taskbar-left { left: auto; right: 12px; }
  html[dir="rtl"] #taskbar-right { right: auto; left: 12px; }
  html[dir="rtl"] #clock { text-align: left; }
  html[dir="rtl"] #start-menu { transform: translateX(-50%) translateY(20px); }
  html[dir="rtl"] #start-menu.show { transform: translateX(-50%) translateY(0); }

  /* ===== RESPONSIVE (SMALL SCREENS) ===== */
  @media (max-width: 768px) {

<body>

<script>
window.IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
// ===== OS CORE =====
const OS = {
  windows: new Map(),
  zIndex: 100,
  activeWindow: null,
  clipboard: { text: '', files: [] },
  fs: {
    'C:': {
      type: 'folder', children: {
        'Users': { type: 'folder', children: {
          'Sha3ban': { type: 'folder', children: {
            'Desktop': { type: 'folder', children: {
              'readme.txt': { type: 'file', ext: 'txt', content: 'Welcome to Sha3ban-os!\n\nThis is a web-based operating system simulation.\n\nFeatures:\n- Window management\n- File explorer\n- Terminal\n- Browser\n- Calculator\n- Paint\n- Notepad\n- Settings\n- Task Manager\n\nEnjoy!' }
            }},
            'Documents': { type: 'folder', children: {
              'notes.txt': { type: 'file', ext: 'txt', content: 'My notes here...' },
              'project.txt': { type: 'file', ext: 'txt', content: 'Project plan...' }
            }},
            'Pictures': { type: 'folder', children: {
              'wallpaper.jpg': { type: 'file', ext: 'img', url: 'images/profile.jpg' }
            }},
            'Downloads': { type: 'folder', children: {} }
          }}
        }},
        'Program Files': { type: 'folder', children: {
          'Sha3banOS': { type: 'folder', children: {
            'system.dll': { type: 'file', ext: 'dll', content: '[binary]' }
          }}
        }},
        'Windows': { type: 'folder', children: {
          'System32': { type: 'folder', children: {} }
        }}
      }
    }
  },
  apps: {},
  recentFiles: []
};

// ===== APPS REGISTRY =====
const APPS = {
  'file-explorer': { name: 'File Explorer', icon: '📁', create: createFileExplorer },
  'notepad': { name: 'Notepad', icon: '', create: createNotepad },
  'calculator': { name: 'Calculator', icon: '', create: createCalculator },
  'paint': { name: 'Paint', icon: '', create: createPaint },
  'browser': { name: 'Browser', icon: '🌐', create: createBrowser },
  'terminal': { name: 'Terminal', icon: '⌨️', create: createTerminal },
  'settings': { name: 'Settings', icon: '⚙️', create: createSettings },
  'taskmgr': { name: 'Task Manager', icon: '', create: createTaskManager },
  'about': { name: 'About Sha3banOS', icon: 'ℹ️', create: createAbout },
  'imgviewer': { name: 'Image Viewer', icon: '🖼️', create: createImageViewer }
};

// ===== BOOT SEQUENCE =====
const bootMessages = [
  'Sha3ban-os BIOS v2.6.0',
  'Copyright (C) 2026 Sha3ban-os Studio',
  '',
  'Detecting hardware...',
  'CPU: Sha3ban Virtual Processor @ 3.2GHz',
  'Memory: 8192 MB OK',
  'Storage: Sha3ban SSD 512GB',
  'Display: Sha3ban Virtual GPU 4K',
  'Network: Sha3ban Virtual NIC',
  '',
  'Initializing kernel...',
  'Loading modules: fs, net, gpu, audio, usb',
  'Starting window manager...',
  'Loading user profile...',
  '',
  'Welcome to Sha3ban-os'
];

async function bootSequence() {
  const bootText = document.getElementById('boot-text');
  for (let i = 0; i < bootMessages.length; i++) {
    bootText.textContent += bootMessages[i] + '\n';
    await sleep(80 + Math.random() * 60);
  }
  await sleep(800);
  document.getElementById('boot-screen').style.opacity = '0';
  await sleep(800);
  document.getElementById('boot-screen').style.display = 'none';
  showLogin();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== LOGIN =====
function showLogin() {
  const ls = document.getElementById('login-screen');
  ls.style.display = 'flex';
  updateLoginTime();
  setInterval(updateLoginTime, 1000);
  document.getElementById('login-pass').focus();
}

function updateLoginTime() {
  const now = new Date();
  document.getElementById('login-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('login-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const pass = e.target.value;
    if (pass !== 'Sha3ban') {
      e.target.style.borderColor = '#e81123';
      e.target.value = '';
      e.target.placeholder = 'Wrong password, try again';
      setTimeout(() => { e.target.style.borderColor = 'rgba(255,255,255,0.3)'; e.target.placeholder = 'Password (press Enter)'; }, 1500);
      return;
    }
    const ls = document.getElementById('login-screen');
    ls.style.opacity = '0';
    setTimeout(() => {
      ls.style.display = 'none';
      document.getElementById('desktop').style.display = 'block';
      initDesktop();
    }, 600);
  }
});

// ===== DESKTOP INIT =====
function initDesktop() {
  renderDesktopIcons();
  renderStartMenu();
  updateClock();
  setInterval(updateClock, 1000);
  setupTaskbar();
  setupContextMenu();
  addNotification('System', 'Welcome to Sha3ban-os! Your desktop is ready.');
  addNotification('Update', 'Sha3banOS is up to date.');
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
}

function renderDesktopIcons() {
  const container = document.getElementById('desktop-icons');
  const icons = [
    { app: 'file-explorer', icon: '📁', label: 'File Explorer' },
    { app: 'browser', icon: '🌐', label: 'Browser' },
    { app: 'notepad', icon: '📝', label: 'Notepad' },
    { app: 'terminal', icon: '⌨️', label: 'Terminal' },
    { app: 'calculator', icon: '🧮', label: 'Calculator' },
    { app: 'paint', icon: '', label: 'Paint' },
    { app: 'settings', icon: '⚙️', label: 'Settings' },
    { app: 'about', icon: 'ℹ️', label: 'About' }
  ];
  container.innerHTML = '';
  icons.forEach(ic => {
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.innerHTML = `<div class="icon">${ic.icon}</div><div class="label">${ic.label}</div>`;
    el.addEventListener('dblclick', () => openApp(ic.app));
    if (window.IS_TOUCH) {
      el.addEventListener('click', e => {
        document.querySelectorAll('.desktop-icon.selected').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        openApp(ic.app);
        e.stopPropagation();
      });
    } else {
      el.addEventListener('click', e => {
        document.querySelectorAll('.desktop-icon.selected').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        e.stopPropagation();
      });
    }
    container.appendChild(el);
  });
  document.getElementById('desktop').addEventListener('click', () => {
    document.querySelectorAll('.desktop-icon.selected').forEach(x => x.classList.remove('selected'));
  });
}

function renderStartMenu() {
  const pinned = document.getElementById('start-pinned');
  pinned.innerHTML = '';
  Object.entries(APPS).forEach(([id, app]) => {
    const el = document.createElement('div');
    el.className = 'start-app';
    el.innerHTML = `<div class="icon">${app.icon}</div><div class="name">${app.name}</div>`;
    el.addEventListener('click', () => { openApp(id); toggleStartMenu(false); });
    pinned.appendChild(el);
  });
  
  const recent = document.getElementById('start-recent');
  recent.innerHTML = `
    <div class="start-recent-item" onclick="openApp('notepad');toggleStartMenu(false)"><span>📝</span> notes.txt</div>
    <div class="start-recent-item" onclick="openApp('file-explorer');toggleStartMenu(false)"><span>📁</span> Documents</div>
    <div class="start-recent-item" onclick="openApp('browser');toggleStartMenu(false)"><span>🌐</span> Sha3banOS Homepage</div>
  `;
}

// ===== TASKBAR =====
function setupTaskbar() {
  document.getElementById('start-btn').addEventListener('click', e => { e.stopPropagation(); toggleStartMenu(); });
  document.getElementById('search-btn').addEventListener('click', e => { e.stopPropagation(); toggleStartMenu(true); });
  document.getElementById('notif-btn').addEventListener('click', e => { e.stopPropagation(); toggleNotifCenter(); });
  document.getElementById('clock').addEventListener('click', e => { e.stopPropagation(); toggleNotifCenter(); });
  document.getElementById('power-btn').addEventListener('click', () => {
    if (confirm('Shut down Sha3ban-os?')) {
      document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;">Shutting down...</div>';
      setTimeout(() => location.reload(), 2000);
    }
  });
  
  document.querySelectorAll('.taskbar-btn[data-app]').forEach(btn => {
    btn.addEventListener('click', () => openApp(btn.dataset.app));
  });
  
  document.addEventListener('click', e => {
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn') && !e.target.closest('#search-btn')) {
      toggleStartMenu(false);
    }
    if (!e.target.closest('#notif-center') && !e.target.closest('#notif-btn') && !e.target.closest('#clock')) {
      toggleNotifCenter(false);
    }
  });
  
  document.querySelectorAll('.qs-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });
}

function toggleStartMenu(force) {
  const sm = document.getElementById('start-menu');
  if (force === true) { sm.classList.add('show'); document.getElementById('start-search').focus(); }
  else if (force === false) sm.classList.remove('show');
  else sm.classList.toggle('show');
}

function toggleNotifCenter(force) {
  const nc = document.getElementById('notif-center');
  if (force === true) nc.classList.add('show');
  else if (force === false) nc.classList.remove('show');
  else nc.classList.toggle('show');
}

// ===== WINDOW MANAGER =====
let windowIdCounter = 0;

function openApp(appId, opts = {}) {
  const app = APPS[appId];
  if (!app) return;
  const id = 'win-' + (++windowIdCounter);
  const win = document.createElement('div');
  win.className = 'window';
  win.id = id;
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = opts.width || 700, h = opts.height || 500;
  if (w > vw - 20) w = vw - 20;
  if (h > vh - 70) h = vh - 70;
  const x = (windowIdCounter % 8) * 30 > vw - w ? Math.max(4, Math.floor((vw - w) / 2)) : 80 + (windowIdCounter % 8) * 30;
  const y = Math.max(30, Math.min(60 + (windowIdCounter % 8) * 30, vh - h - 55));
  win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++OS.zIndex}`;
  win.innerHTML = `
    <div class="window-titlebar">
      <div class="window-title"><span>${app.icon}</span><span>${opts.title || app.name}</span></div>
      <div class="window-controls">
        <div class="window-ctrl min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="#fff" stroke-width="1.2"/></svg></div>
        <div class="window-ctrl max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="#fff" stroke-width="1.2"/></svg></div>
        <div class="window-ctrl close" title="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#fff" stroke-width="1.2"/></svg></div>
      </div>
    </div>
    <div class="window-body"></div>
    <div class="window-resize"></div>
  `;
  document.getElementById('desktop').appendChild(win);
  const body = win.querySelector('.window-body');
  app.create(body, opts, id);
  OS.windows.set(id, { el: win, appId, title: opts.title || app.name, minimized: false, maximized: false });
  focusWindow(id);
  makeDraggable(win);
  makeResizable(win);
  setupWindowControls(win, id);
  win.addEventListener('mousedown', () => focusWindow(id));
  updateTaskbarApps();
  return id;
}

function focusWindow(id) {
  const w = OS.windows.get(id);
  if (!w) return;
  if (w.minimized) { w.minimized = false; w.el.style.display = 'flex'; }
  w.el.style.zIndex = ++OS.zIndex;
  OS.activeWindow = id;
  updateTaskbarApps();
}

function setupWindowControls(win, id) {
  win.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeWindow(id); });
  win.querySelector('.min').addEventListener('click', e => { e.stopPropagation(); minimizeWindow(id); });
  win.querySelector('.max').addEventListener('click', e => { e.stopPropagation(); toggleMaximize(id); });
  win.querySelector('.window-titlebar').addEventListener('dblclick', e => { if (e.target.closest('.window-controls')) return; toggleMaximize(id); });
}

function closeWindow(id) {
  const w = OS.windows.get(id);
  if (!w) return;
  w.el.remove();
  OS.windows.delete(id);
  updateTaskbarApps();
}

function minimizeWindow(id) {
  const w = OS.windows.get(id);
  w.minimized = true;
  w.el.style.display = 'none';
  updateTaskbarApps();
}

function toggleMaximize(id) {
  const w = OS.windows.get(id);
  if (w.maximized) {
    w.maximized = false;
    w.el.classList.remove('maximized');
    Object.assign(w.el.style, w.prevStyle);
  } else {
    w.prevStyle = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.maximized = true;
    w.el.classList.add('maximized');
    w.el.style.left = '0'; w.el.style.top = '0';
    w.el.style.width = '100%'; w.el.style.height = 'calc(100% - 48px)';
  }
}

function makeDraggable(win) {
  const tb = win.querySelector('.window-titlebar');
  let sx, sy, ox, oy, dragging = false;
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.window-controls')) return;
    const w = OS.windows.get(win.id);
    if (w && w.maximized) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    win.style.left = (ox + e.clientX - sx) + 'px';
    win.style.top = Math.max(0, oy + e.clientY - sy) + 'px';
  });
  document.addEventListener('mouseup', () => dragging = false);
}

function makeResizable(win) {
  const handle = win.querySelector('.window-resize');
  let sx, sy, sw, sh, resizing = false;
  handle.addEventListener('mousedown', e => {
    const w = OS.windows.get(win.id);
    if (w && w.maximized) return;
    resizing = true; sx = e.clientX; sy = e.clientY;
    sw = win.offsetWidth; sh = win.offsetHeight;
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    win.style.width = Math.max(320, sw + e.clientX - sx) + 'px';
    win.style.height = Math.max(200, sh + e.clientY - sy) + 'px';
  });
  document.addEventListener('mouseup', () => resizing = false);
}

function updateTaskbarApps() {
  document.querySelectorAll('.taskbar-app-btn').forEach(b => b.remove());
  const center = document.getElementById('taskbar-center');
  OS.windows.forEach((w, id) => {
    const btn = document.createElement('div');
    btn.className = 'taskbar-btn taskbar-app-btn' + (OS.activeWindow === id && !w.minimized ? ' active' : '');
    btn.innerHTML = `<span style="font-size:18px">${APPS[w.appId].icon}</span>`;
    btn.title = w.title;
    btn.addEventListener('click', () => {
      if (OS.activeWindow === id && !w.minimized) minimizeWindow(id);
      else focusWindow(id);
    });
    center.appendChild(btn);
  });
}

function createFileExplorer(body, opts, winId) {
  let virtualPath = opts.path || ['C:', 'Users', 'Sha3ban'];

  `;
  const content = body.querySelector('.fe-content');
  const pathEl = body.querySelector('.fe-path');
  let realStack = [];
  
  async function getVirtualNode(path) {
    let node = OS.fs;
    for (const p of path) { node = node[p].children || node[p]; if (!node) return null; }
    return node;
  }
  
  async function renderReal(dirHandle) {
    content.innerHTML = '<div style="font-size:12px;opacity:0.7;padding:12px">جارٍ تحميل ...</div>';
    try {
      const entries = [];
      for await (const entry of dirHandle.values()) {
        const kind = entry.kind; 
        entries.push({ name: entry.name, kind, handle: entry });
      }
      entries.sort((a, b) => (a.kind === b.kind ? a.name.localeCompare(b.name) : (a.kind === 'directory' ? -1 : 1)));
      content.innerHTML = '';
      for (const e of entries) {
        const el = document.createElement('div');
        el.className = 'fe-item';
        const ext = e.name.split('.').pop().toLowerCase();
        const icon = e.kind === 'directory' ? '📁'
          : ['png','jpg','jpeg','gif','bmp','webp','svg'].includes(ext) ? '🖼️'
          : ['txt','md','log','json','html','css','js'].includes(ext) ? '📄'
          : ext === 'mp3' || ext === 'wav' ? '🎵'
          : ['mp4','avi','mkv','mov'].includes(ext) ? '🎬'
          : '📦';
        el.innerHTML = `<div class="icon">${icon}</div><div class="name">${e.name}</div>`;
        el.addEventListener('dblclick', async () => {
          if (e.kind === 'directory') { realStack.push(realHandle); realHandle = e.handle; renderReal(e.handle); }
          else {
            const file = await e.handle.getFile();
            const type = file.type;
            if (type.startsWith('image/')) {
              const url = URL.createObjectURL(file);
              openApp('imgviewer', { title: e.name, url });
            } else if (type.startsWith('text/') || /\.(txt|md|log|json|js|css|html|xml|csv)$/i.test(e.name)) {
              const text = await file.text();
              openApp('notepad', { title: e.name, content: text });
              toast('تم فتح ' + e.name);
            } else {
              window.open(URL.createObjectURL(file), '_blank');
              toast('تم فتح ' + e.name + ' في نافذة خارجية');
            }
          }
        });
        el.addEventListener('click', ev => { content.querySelectorAll('.fe-item.selected').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); ev.stopPropagation(); });
        if (window.IS_TOUCH) {
          el.addEventListener('click', async function openOnTap(ev) {
            if (e.kind === 'directory') { realStack.push(realHandle); realHandle = e.handle; renderReal(e.handle); }
            else {
              const file = await e.handle.getFile();
              const type = file.type;
              if (type.startsWith('image/')) { openApp('imgviewer', { title: e.name, url: URL.createObjectURL(file) }); }
              else if (type.startsWith('text/') || /\.(txt|md|log|json|js|css|html|xml|csv)$/i.test(e.name)) { openApp('notepad', { title: e.name, content: await file.text() }); }
              else { window.open(URL.createObjectURL(file), '_blank'); }
            }
            ev.stopPropagation();
          });
        }
        content.appendChild(el);
      }
      if (!entries.length) content.innerHTML = '<div style="font-size:12px;opacity:0.7;padding:12px">المجلد فارغ</div>';
      pathEl.textContent = '💻 ' + dirHandle.name;
      isReal = true;
    } catch (err) { content.textContent = 'تعذّر الوصول: ' + err.message; }
  }
  
  async function renderVirtual() {
    const node = await getVirtualNode(virtualPath);
    pathEl.textContent = virtualPath.join('\\');
    content.innerHTML = '';
    if (!node) { content.textContent = 'Empty'; return; }
    Object.entries(node).forEach(([name, item]) => {
      const el = document.createElement('div');
      el.className = 'fe-item';
      const icon = item.type === 'folder' ? '📁' : item.ext === 'txt' ? '📄' : item.ext === 'img' ? '🖼️' : '📦';
      el.innerHTML = `<div class="icon">${icon}</div><div class="name">${name}</div>`;
      el.addEventListener('dblclick', () => {
        if (item.type === 'folder') { virtualPath.push(name); renderVirtual(); }
        else if (item.ext === 'txt') openApp('notepad', { title: name, content: item.content, path: [...virtualPath, name] });
        else if (item.ext === 'img') openApp('imgviewer', { title: name, url: item.url });
      });
      el.addEventListener('click', e => { content.querySelectorAll('.fe-item.selected').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); e.stopPropagation(); });
      content.appendChild(el);
    });
    isReal = false;
  }
  
  async function refresh() { if (isReal) await renderReal(realHandle); else await renderVirtual(); }
  
  body.querySelectorAll('.fe-sidebar-item').forEach(it => {
    it.addEventListener('click', () => {
      if (it.classList.contains('fe-real')) {
        if (!supportsFS) { toast('يجب فتح عبر خادم (http) — استخدم مثلاً: python -m http.server'); return; }
        window.showDirectoryPicker().then(async handle => { realStack = []; realHandle = handle; await renderReal(handle); })
          .catch(() => toast('تم إلغاء اختيار المجلد'));
        return;
      }
      isReal = false;
      virtualPath = it.dataset.path.split(',');
      renderVirtual();
    });
  });
  body.querySelector('.fe-up').addEventListener('click', () => {
    if (isReal) { if (realStack.length) { realHandle = realStack.pop(); renderReal(realHandle); } }
    else if (virtualPath.length > 1) { virtualPath.pop(); renderVirtual(); }
  });
  body.querySelector('.fe-back').addEventListener('click', () => {
    if (isReal) { if (realStack.length) { realHandle = realStack.pop(); renderReal(realHandle); } }
    else if (virtualPath.length > 1) { virtualPath.pop(); renderVirtual(); }
  });
  body.querySelector('.fe-newfolder').addEventListener('click', async () => {
    const name = prompt('Folder name:');
    if (!name) return;
    if (isReal && realHandle) {
      try { await realHandle.getDirectoryHandle(name, { create: true }); toast('تم إنشاء المجلد'); await refresh(); }
      catch (e) { toast('تعذّر إنشاء المجلد'); }
    } else {
      const node = await getVirtualNode(virtualPath);
      node[name] = { type: 'folder', children: {} };
      renderVirtual();
      toast('Folder created');
    }
  });
  renderVirtual();
}

function createPaint(body) {
  body.innerHTML = `
    <div class="app-paint">
      <div class="paint-toolbar">
        <button class="pt-tool active" data-tool="brush">🖌️ Brush</button>
        <button class="pt-tool" data-tool="eraser">🧽 Eraser</button>
        <button class="pt-tool" data-tool="line"> Line</button>
        <button class="pt-tool" data-tool="rect"> Rect</button>
        <button class="pt-tool" data-tool="circle"> Circle</button>
        <input type="color" class="pt-color" value="#000000">
        <input type="range" class="pt-size" min="1" max="50" value="4">
        <button class="pt-clear">🗑️ Clear</button>
        <button class="pt-save">💾 Save</button>
      </div>
      <div class="paint-canvas-wrap"><canvas width="800" height="500"></canvas></div>
    </div>
  `;
  const canvas = body.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let tool = 'brush', color = '#000', size = 4, drawing = false, sx, sy, snapshot;
  
  body.querySelectorAll('.pt-tool').forEach(b => b.addEventListener('click', () => {
    body.querySelectorAll('.pt-tool').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); tool = b.dataset.tool;
  }));
  body.querySelector('.pt-color').addEventListener('input', e => color = e.target.value);
  body.querySelector('.pt-size').addEventListener('input', e => size = parseInt(e.target.value));
  body.querySelector('.pt-clear').addEventListener('click', () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); });
  body.querySelector('.pt-save').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'paint.png'; link.href = canvas.toDataURL(); link.click();
    toast('Image saved');
  });
  
  function getPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height }; }
  canvas.addEventListener('mousedown', e => {
    drawing = true; const p = getPos(e); sx = p.x; sy = p.y;
    ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
    ctx.fillStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round';
    if (tool === 'brush' || tool === 'eraser') { ctx.beginPath(); ctx.moveTo(sx, sy); }
    else snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  });
  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const p = getPos(e);
    if (tool === 'brush' || tool === 'eraser') { ctx.lineTo(p.x, p.y); ctx.stroke(); }
    else {
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      if (tool === 'line') { ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      else if (tool === 'rect') ctx.rect(sx, sy, p.x - sx, p.y - sy);
      else if (tool === 'circle') { const r = Math.hypot(p.x - sx, p.y - sy); ctx.arc(sx, sy, r, 0, Math.PI * 2); }
      if (tool !== 'line') ctx.stroke();
    }
  });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);
}

function createBrowser(body, opts) {

  body.innerHTML = `
    <div class="app-browser">

    </div>
  `;
  const tabsEl = body.querySelector('.browser-tabs');
  const contEl = body.querySelector('.browser-content');
  const urlInput = body.querySelector('.browser-url');
  const statusbar = body.querySelector('.browser-statusbar');
  const backBtn = body.querySelector('.br-back');
  const fwdBtn = body.querySelector('.br-fwd');
  const reloadBtn = body.querySelector('.br-reload');
  let tabs = [];
  let activeTab = null;
  function normalize(u) {
    u = u.trim();
    if (!u) return null;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function addTab(url, activate = true) {
    const id = 'btab-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    tabs.push({ id, url, title: 'Loading...' });
    if (activate) setActive(id);
    renderTabs();
    return id;
  }
  function setActive(id) {
    activeTab = id;
    const t = tabs.find(x => x.id === id);
    if (t) urlInput.value = t.url;
    renderTabs();
    const frame = contEl.querySelector('iframe[data-id="' + id + '"]');
    if (frame) frame.style.display = 'block';
    contEl.querySelectorAll('iframe').forEach(f => { if (f.dataset.id !== id) f.style.display = 'none'; });
  }
  function closeTab(id) {
    tabs = tabs.filter(x => x.id !== id);
    const frame = contEl.querySelector('iframe[data-id="' + id + '"]');
    if (frame) frame.remove();
    if (activeTab === id) {
      if (tabs.length) setActive(tabs[tabs.length - 1].id);
      else { activeTab = null; urlInput.value = ''; showNewTab(); renderTabs(); }
    } else renderTabs();
  }
  function createFrame(tab) {
    const iframe = document.createElement('iframe');
    iframe.dataset.id = tab.id;
    iframe.addEventListener('load', () => {
      tab.title = iframe.contentDocument ? iframe.contentDocument.title || tab.url : tab.url;
      renderTabs();
    });
    return iframe;
  }
  function showNewTab() {
    contEl.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
    const wrap = document.createElement('div');
    wrap.className = 'browser-opennew';
    wrap.innerHTML = `
      <div style="font-size:48px;opacity:0.3">🌐</div>
      <div>اكتب رابطاً في الشريط بالأعلى ثم اضغط Go</div>
      <div class="sep">— أو —</div>
      <button class="bn-open">فتح في نافذة خارجية</button>
      <div class="sep">بعض المواقع تمنع التصفح داخل إطار مدمج، لذا يمكن فتحها في تبويب حقيقي</div>
    `;
    wrap.querySelector('.bn-open').addEventListener('click', () => {
      if (activeTab && tabs.find(t => t.id === activeTab)) {
        window.open(tabs.find(t => t.id === activeTab).url, '_blank');
      }
    });
    contEl.appendChild(wrap);
  }
  function loadSelected() {
    const u = normalize(urlInput.value);
    if (!u) return;
    let t = tabs.find(x => x.id === activeTab);
    if (!t) {
      t = { id: 'btab-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), url: u, title: u };
      tabs.push(t);
      activeTab = t.id;
      renderTabs();
    } else {
      t.url = u;
    }
    urlInput.value = u;
    contEl.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
    let iframe = contEl.querySelector('iframe[data-id="' + t.id + '"]');
    if (!iframe) {
      iframe = createFrame(t);
      contEl.appendChild(iframe);
    }
    const open = contEl.querySelector('.browser-opennew'); if (open) open.remove();
    iframe.src = u;
    iframe.style.display = 'block';
    statusbar.textContent = 'جارٍ تحميل ' + u + ' ...';

    let loadedOk = false;
    iframe.addEventListener('load', () => {
      try {
        loadedOk = true;
        const doc = iframe.contentDocument;
        if (doc && (doc.title || '').indexOf('ERR_') !== -1) loadedOk = false;
      } catch (e) { loadedOk = iframe.src && /^(about|data|blob):/.test(iframe.src); }
      if (!loadedOk) showOpenExternal(t, u);
      else { tabLoadedOk(t, iframe); }
    });

    setTimeout(() => {
      if (!loadedOk && contEl.contains(iframe)) showOpenExternal(t, u);
    }, 4000);

    renderTabs();
  }
  function tabLoadedOk(t, iframe) {
    try { t.title = iframe.contentDocument ? iframe.contentDocument.title || t.url : t.url; statusbar.textContent = 'تم التحميل: ' + t.title; }
    catch (e) { t.title = t.url; statusbar.textContent = t.url; }
    renderTabs();
  }
  function showOpenExternal(t, u) {
    const wrap = document.createElement('div');
    wrap.className = 'browser-opennew';
    wrap.innerHTML = `
      <div style="font-size:40px;opacity:0.3">🔒</div>
      <div style="max-width:320px;text-align:center">لا يمكن عرض هذا الموقع داخل نافذة مدمجة، لأنّه يمنع التحميل داخل iframe (Google، تسجيل الدخول، البنوك...).</div>
      <div style="font-size:12px;opacity:0.7;word-break:break-all;max-width:360px">${u}</div>
      <button class="bn-open">فتح في نافذة خارجية</button>
      <button class="bn-tryagain" style="background:rgba(255,255,255,0.15)">المحاولة مجدداً داخل النافذة</button>
    `;
    wrap.querySelector('.bn-open').addEventListener('click', () => window.open(u || t.url, '_blank'));
    wrap.querySelector('.bn-tryagain').addEventListener('click', () => {
      const f = contEl.querySelector('iframe[data-id="' + t.id + '"]');
      if (f) { const src = f.src; f.src = 'about:blank'; setTimeout(() => f.src = src, 50); }
      wrap.remove();
    });
    contEl.appendChild(wrap);
    statusbar.textContent = 'تعذّر التحميل داخل النافذة — ستتم إعادة التوجيه إلى تبويب خارجي';
  }
  reloadBtn.addEventListener('click', () => {
    if (!activeTab) return;
    const t = tabs.find(x => x.id === activeTab);
    if (!t) return;
    const iframe = contEl.querySelector('iframe[data-id="' + t.id + '"]');
    if (iframe) iframe.src = t.url;
  });
  backBtn.addEventListener('click', () => { try { const f = contEl.querySelector('iframe[data-id="' + activeTab + '"]'); f && f.contentWindow.history.back(); } catch {} });
  fwdBtn.addEventListener('click', () => { try { const f = contEl.querySelector('iframe[data-id="' + activeTab + '"]'); f && f.contentWindow.history.forward(); } catch {} });
  body.querySelector('.br-go').addEventListener('click', loadSelected);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadSelected(); });
  function renderTabs() {
    tabsEl.innerHTML = '';
    tabs.forEach(t => {
      const el = document.createElement('div');
      el.className = 'browser-tab' + (t.id === activeTab ? ' active' : '');
      el.innerHTML = `<span>${t.title || t.url}</span><span class="close-tab">✕</span>`;
      el.addEventListener('click', e => {
        if (e.target.classList.contains('close-tab')) { closeTab(t.id); return; }
        setActive(t.id);
      });
      tabsEl.appendChild(el);
    });
    const newBtn = document.createElement('div');
    newBtn.className = 'browser-tab-new';
    newBtn.textContent = '+';
    newBtn.addEventListener('click', () => { addTab('about:blank'); showNewTab(); urlInput.value = ''; urlInput.focus(); });
    tabsEl.appendChild(newBtn);
    if (!tabs.length) showNewTab();
  }
  renderTabs();
  addTab(initialUrl);
  loadSelected();
  urlInput.focus();
}

// ===== TERMINAL =====
function createTerminal(body) {
  body.innerHTML = `<div class="app-terminal"></div>`;
  const term = body.querySelector('.app-terminal');
  let cwd = ['C:', 'Users', 'Sha3ban'];
  const history = [];
  let histIdx = -1;
  
  function print(text, cls = '') {
    const line = document.createElement('div');
    line.className = 'terminal-line' + (cls ? ' ' + cls : '');
    line.textContent = text;
    term.appendChild(line);
  }
  
  function prompt() {
    const line = document.createElement('div');
    line.className = 'terminal-input-line';
    line.innerHTML = `<span class="terminal-prompt">${cwd.join('\\')}&gt;</span><input class="terminal-input" autofocus>`;
    term.appendChild(line);
    const input = line.querySelector('input');
    input.focus();
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const cmd = input.value.trim();
        input.disabled = true;
        if (cmd) { history.push(cmd); histIdx = history.length; execute(cmd); }
        prompt();
        term.scrollTop = term.scrollHeight;
      } else if (e.key === 'ArrowUp') { if (histIdx > 0) { histIdx--; input.value = history[histIdx]; } e.preventDefault(); }
      else if (e.key === 'ArrowDown') { if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; } else { histIdx = history.length; input.value = ''; } e.preventDefault(); }
    });
  }
  
  function getNode(path) {
    let node = OS.fs;
    for (const p of path) { node = node[p].children || node[p]; if (!node) return null; }
    return node;
  }
  
  function execute(cmd) {
    print(cwd.join('\\') + '> ' + cmd, '');
    const parts = cmd.split(/\s+/);
    const c = parts[0].toLowerCase(), args = parts.slice(1);
    switch (c) {
      case 'help': print('Commands: help, dir, cd, cls, echo, date, time, ver, whoami, ipconfig, ping, tasklist, exit, mkdir, type, del'); break;
      case 'dir': case 'ls': {
        const node = getNode(cwd);
        if (!node) { print('Directory not found'); break; }
        Object.entries(node).forEach(([n, it]) => {
          const d = it.type === 'folder' ? '<DIR>' : (it.content ? it.content.length + ' bytes' : '');
          print(`${n.padEnd(25)} ${d}`);
        });
        break;
      }
      case 'cd': {
        if (!args[0]) { print(cwd.join('\\')); break; }
        if (args[0] === '..') { if (cwd.length > 1) cwd.pop(); }
        else { const node = getNode(cwd); if (node && node[args[0]] && node[args[0]].type === 'folder') cwd.push(args[0]); else print('Directory not found'); }
        break;
      }
      case 'cls': case 'clear': term.innerHTML = ''; break;
      case 'echo': print(args.join(' ')); break;
      case 'date': print(new Date().toDateString()); break;
      case 'time': print(new Date().toTimeString()); break;
      case 'ver': print('Sha3banOS Version 1.0.2026'); break;
      case 'whoami': print('Sha3banOS\\user'); break;
      case 'ipconfig': print('Ethernet adapter:'); print('  IPv4: 192.168.1.100'); print('  Subnet: 255.255.255.0'); print('  Gateway: 192.168.1.1'); print('  DNS: 8.8.8.8'); break;
      case 'ping': print(`Pinging ${args[0] || 'localhost'}...`); setTimeout(() => { print('Reply: time=12ms TTL=64'); print('Reply: time=11ms TTL=64'); print('Reply: time=13ms TTL=64'); print('Ping statistics: 0% loss'); }, 300); break;
      case 'tasklist': {
        print('PID'.padEnd(8) + 'Name'.padEnd(25) + 'Memory');
        OS.windows.forEach((w, id) => {
          print(id.padEnd(8) + w.title.padEnd(25) + (Math.floor(Math.random() * 50 + 10) + ' MB'));
        });
        break;
      }
      case 'mkdir': {
        if (!args[0]) { print('Usage: mkdir <name>'); break; }
        const node = getNode(cwd); node[args[0]] = { type: 'folder', children: {} }; print('Directory created'); break;
      }
      case 'type': case 'cat': {
        if (!args[0]) { print('Usage: type <file>'); break; }
        const node = getNode(cwd);
        if (node && node[args[0]] && node[args[0]].type === 'file') print(node[args[0]].content);
        else print('File not found');
        break;
      }
      case 'del': case 'rm': {
        if (!args[0]) { print('Usage: del <file>'); break; }
        const node = getNode(cwd);
        if (node && node[args[0]]) { delete node[args[0]]; print('Deleted'); }
        else print('Not found');
        break;
      }
      case 'exit': closeWindow(body.closest('.window').id); break;
      default: print(`'${c}' is not recognized. Type 'help' for commands.`);
    }
  }
  
  print('Sha3banOS Terminal [Version 1.0.2026]');
  print('(c) 2026 Sha3ban Studio. All rights reserved.');
  print('');
  prompt();
  term.addEventListener('click', () => { const i = term.querySelector('input:not([disabled])'); if (i) i.focus(); });
}
